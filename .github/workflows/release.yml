---
name: Release

on: push

jobs:
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Read version to environment
        run: echo "VERSION=$(cat resources/POD_ILMORAUNIO_CONJTEST)" >> $GITHUB_ENV
      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          bb: 1.3.190
      - name: Build uberjar
        run: bb uberjar target/pod-ilmoraunio-conjtest.jar -m pod-ilmoraunio-conjtest.core
      - name: Build binary
        run: cat $(which bb) target/pod-ilmoraunio-conjtest.jar > pod-ilmoraunio-conjtest && chmod +x pod-ilmoraunio-conjtest
      - name: Test build
        run: ./scripts/test
      - name: Debug
        run: ls -lart
      - name: Produce artifact
        run: zip pod-ilmoraunio-conjtest-$VERSION-macos-aarch64.zip pod-ilmoraunio-conjtest
      - name: Release artifact
        run: bb --config bb.ci.edn release-artifact --file pod-ilmoraunio-conjtest-$VERSION-macos-aarch64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Read version to environment
        run: echo "VERSION=$(cat resources/POD_ILMORAUNIO_CONJTEST)" >> $GITHUB_ENV
      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          bb: 1.3.190
      - name: Build uberjar
        run: bb uberjar target/pod-ilmoraunio-conjtest.jar -m pod-ilmoraunio-conjtest.core
      - name: Build binary
        run: cat $(which bb) target/pod-ilmoraunio-conjtest.jar > pod-ilmoraunio-conjtest && chmod +x pod-ilmoraunio-conjtest
      - name: Test build
        run: ./scripts/test
      - name: Debug
        run: ls -lart
      - name: Produce artifact
        run: zip pod-ilmoraunio-conjtest-$VERSION-linux-amd64.zip pod-ilmoraunio-conjtest
      - name: Release artifact
        run: bb --config bb.ci.edn release-artifact --file pod-ilmoraunio-conjtest-$VERSION-linux-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
